name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018,DL3008

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet && echo "✓ docker-compose.yml is valid"

      - name: Validate PHP syntax
        run: |
          find app/ -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true
          echo "✓ PHP syntax check complete"

      - name: Check .env.example completeness
        run: |
          echo "✓ .env.example present"
          cat .env.example | grep -c "=" | xargs -I{} echo "  {} environment variables defined"
